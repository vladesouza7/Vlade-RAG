name: CI

on:
  push:
    branches: [main, homolog]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} (native=${{ matrix.native }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        native: [false, true]
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: vlade_owner
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vlade_owner" --health-interval 5s
          --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:9.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
      rustfs:
        # The S3 service of the Compose file (ADR-0017). The ObjectStorage contract runs against it.
        image: rustfs/rustfs:1.0.6
        env:
          RUSTFS_ACCESS_KEY: ci-only-access
          RUSTFS_SECRET_KEY: ci-only-secret-key
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl --fail --silent http://127.0.0.1:9000/health" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      VLADE_TEST_DATABASE_URL: postgresql://vlade_owner:ci-only-password@localhost:5432/postgres
      VLADE_TEST_VALKEY_URL: redis://localhost:6379/0
      VLADE_TEST_S3_ENDPOINT: http://localhost:9000
      VLADE_TEST_S3_BUCKET: vlade-ci
      VLADE_TEST_S3_ACCESS_KEY: ci-only-access
      VLADE_TEST_S3_SECRET_KEY: ci-only-secret-key
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.native
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install
        run: >
          uv sync --locked --package vlade-rag
          --extra api --extra cli --extra postgres --extra ollama --extra openai --extra otel
          --extra cache --extra mcp --extra s3 --extra langgraph --extra eval --extra qdrant --extra sql --extra oidc
          ${{ matrix.native && '--extra native' || '' }}
      - name: Install dev tools
        # Recent uv versions do not install the root dev group with --package.
        run: uv sync --locked --inexact --only-group dev
      - name: Check native backend
        run: |
          backend=$(uv run --no-sync python -c "from vlade_rag.native import backend; print(backend())")
          echo "backend=$backend"
          test "$backend" = "${{ matrix.native && 'rust' || 'python' }}"
      - name: Ruff
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Mypy
        run: uv run --no-sync mypy
      - name: Pytest
        run: uv run --no-sync pytest --cov --cov-report=term --cov-fail-under=85

  quality-gate:
    name: Quality gate (RF-73)
    runs-on: ubuntu-latest
    env:
      # Throwaway bases in memory, hashing embeddings: no service and no provider (ADR-0024).
      VLADE_STORAGE__BACKEND: memory
      VLADE_OBJECT_STORAGE__BACKEND: memory
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked --package vlade-rag --extra cli
      - name: Compare the retrieval metrics with evals/gate/baseline.json
        run: uv run --no-sync vlade-rag eval gate

  bm25:
    name: BM25 retriever (pg_search)
    runs-on: ubuntu-latest
    env:
      VLADE_TEST_BM25_DATABASE_URL: postgresql://vlade_owner:ci-only-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - name: Build vlade-postgres-bm25
        run: docker build -f deploy/postgres/Dockerfile.bm25 -t vlade-postgres-bm25:ci deploy/postgres
      - name: Start PostgreSQL
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=vlade_owner             -e POSTGRES_PASSWORD=ci-only-password -e POSTGRES_DB=postgres vlade-postgres-bm25:ci
          # The init server listens only on the socket, so a TCP check waits for the real server.
          for i in $(seq 1 60); do
            docker exec pg pg_isready -h 127.0.0.1 -U vlade_owner && exit 0
            sleep 2
          done
          docker logs pg
          exit 1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked --package vlade-rag --extra postgres
      - name: Install dev tools
        run: uv sync --locked --inexact --only-group dev
      - name: Pytest
        run: uv run --no-sync pytest tests/integration/test_bm25.py -q

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --no-default-features

  mcp:
    name: MCP server (Inspector)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: vlade_owner
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vlade_owner" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      VLADE_DATABASE__OWNER_URL: postgresql://vlade_owner:ci-only-password@localhost:5432/postgres
      VLADE_DATABASE__URL: postgresql://vlade_app:ci-only-app-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: uv sync --locked --package vlade-rag --extra cli --extra postgres --extra mcp
      - name: MCP Inspector (CLI mode) against the server
        # The Inspector runs only here, as a test tool. It is not a dependency of the package.
        run: bash scripts/mcp_inspector.sh

  licenses:
    name: Licenses (ADR-0001)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Python runtime dependencies
        run: |
          uv venv /tmp/lic
          # The docling extra pulls PyTorch and NVIDIA CUDA libraries (proprietary). ADR-0001
          # item 4 keeps non-permissive dependencies in optional extras, so it is not checked here.
          uv export --frozen --no-dev --package vlade-rag --extra server --extra api --extra cli --extra postgres --extra ollama --extra openai --extra otel --extra cache --extra mcp --extra s3 --extra langgraph --extra eval --extra qdrant --extra sql --extra oidc --no-emit-workspace -o /tmp/req.txt
          uv pip install --python /tmp/lic/bin/python -r /tmp/req.txt
          uvx pip-licenses==5.5.5 --python /tmp/lic/bin/python --from=mixed --format=json > /tmp/licenses.json
          python3 scripts/check_licenses.py /tmp/licenses.json
      - name: Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      - name: Rust advisories (non-blocking)
        uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        with:
          command: check advisories

  alerts:
    name: Alert rules (promtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the Prometheus configuration
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/deploy/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.16.0 check config /etc/prometheus/prometheus.yml
      - name: Provoke every failure and check that its alert fires
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD:/repo:ro" \
            prom/prometheus:v3.16.0 test rules /repo/tests/promtool/alerts.test.yml

  docs:
    name: Docs (ASD-STE100 pt-BR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Linter self-test
        run: python3 .claude/skills/asd-ste100-pt-br/scripts/ste-lint-ptbr.py --selftest
      - name: Lint documentation
        run: |
          shopt -s nullglob
          python3 .claude/skills/asd-ste100-pt-br/scripts/ste-lint-ptbr.py \
            --disable rotacao-de-sinonimos \
            VLADE-RAG.md CLAUDE.md README.md CONTRIBUTING.md CODE_OF_CONDUCT.md \
            SECURITY.md CHANGELOG.md docs/*.md docs/adr/*.md docs/operacao/*.md \
            packages/python/README.md packages/rust/*/README.md \
            evals/datasets/README.md evals/datasets/*/README.md evals/reports/README.md \
            evals/reports/*/README.md \
            skills/*/SKILL.md

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: vlade-rag (sdist and wheel)
        run: uv build --package vlade-rag --out-dir dist
      - name: vlade-rag-core (manylinux wheel)
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist -m packages/rust/vlade_rag_core/Cargo.toml
          manylinux: auto
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  compose:
    name: Docker Compose (dev profile)
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
      VLADE_APP_DB_PASSWORD: ci-only-app-password
      VLADE_API_KEY_PEPPER: ci-only-pepper
    steps:
      - uses: actions/checkout@v7
      - name: Validate
        run: |
          docker compose --profile dev config --quiet
          docker compose --profile dev --profile s3 config --quiet
          docker compose --profile staging config --quiet
      - name: Start
        run: docker compose --profile dev up --detach --build --wait --wait-timeout 300
      - name: Smoke test
        run: |
          curl --fail --silent http://127.0.0.1:8000/health/live | tee /tmp/live.json
          grep -q '"native_backend":"rust"' /tmp/live.json
          curl --fail --silent http://127.0.0.1:8000/health/ready
      - name: Logs on failure
        if: failure()
        run: docker compose --profile dev logs
      - name: Stop
        if: always()
        run: docker compose --profile dev down --volumes
