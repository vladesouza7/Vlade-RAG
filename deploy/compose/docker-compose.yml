# Vlade-RAG services. Profiles: dev, staging, prod (docs/ARCHITECTURE.md section 17).
# Run from the repository root: docker compose --profile dev up
# Models: remote providers (OpenRouter, OpenCode, OpenAI) need only API keys in .env.
# Optional local model server: add --profile ollama and set OLLAMA_BASE_URL=http://ollama:11434
# Memory limits keep the dev profile under 3 GB without Ollama (RNF-11).
# Observability (staging, prod): Alloy, Prometheus, Loki, Tempo and Grafana (ADR-0015).
# The stack listens on 127.0.0.1 only. The configuration is in deploy/observability/.

x-app-env: &app-env
  VLADE_ENVIRONMENT: ${VLADE_ENVIRONMENT:-dev}
  VLADE_LOG_LEVEL: ${VLADE_LOG_LEVEL:-INFO}
  VLADE_DATABASE__URL: postgresql://vlade_app:${VLADE_APP_DB_PASSWORD:?Defina VLADE_APP_DB_PASSWORD no arquivo .env}@postgres:5432/vlade
  VLADE_SECURITY__API_KEY_PEPPER: ${VLADE_API_KEY_PEPPER:?Defina VLADE_API_KEY_PEPPER no arquivo .env}
  # Cache and request limits in Valkey (ADR-0007). Set it empty to keep them in the process.
  VLADE_CACHE__URL: ${VLADE_CACHE__URL-redis://valkey:6379/0}
  VLADE_PROVIDERS__OLLAMA__BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  VLADE_PROVIDERS__OLLAMA__THINK: ${OLLAMA_THINK:-false}
  VLADE_PROVIDERS__OPENAI__API_KEY: ${OPENAI_API_KEY:-}
  VLADE_PROVIDERS__OPENROUTER__API_KEY: ${OPENROUTER_API_KEY:-}
  VLADE_PROVIDERS__OPENCODE__API_KEY: ${OPENCODE_API_KEY:-}
  # Knowledge graph with LightRAG (phase 6, ADR-0032). Empty: no base can enable the graph.
  # Example: postgresql://vlade_graph:<VLADE_GRAPH_DB_PASSWORD>@postgres:5432/vlade_graph
  VLADE_GRAPH__DATABASE_URL: ${VLADE_GRAPH__DATABASE_URL:-}
  VLADE_GRAPH__WORKING_DIR: /data/graph
  VLADE_PROVIDERS__GEMINI__API_KEY: ${GEMINI_API_KEY:-}
  VLADE_PROVIDERS__GEMINI__EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-false}
  # Vector index: "postgres" (pgvector, the default) or "qdrant" (ADR-0004).
  VLADE_VECTOR_INDEX__BACKEND: ${VLADE_VECTOR_INDEX__BACKEND:-postgres}
  VLADE_VECTOR_INDEX__QDRANT__URL: ${VLADE_VECTOR_INDEX__QDRANT__URL:-http://qdrant:6333}
  VLADE_VECTOR_INDEX__QDRANT__API_KEY: ${VLADE_VECTOR_INDEX__QDRANT__API_KEY:-}
  # Object storage: "filesystem" (a volume) or "s3" (AWS or any S3-compatible service, ADR-0006).
  VLADE_OBJECT_STORAGE__BACKEND: ${VLADE_OBJECT_STORAGE__BACKEND:-filesystem}
  VLADE_OBJECT_STORAGE__S3__BUCKET: ${S3_BUCKET:-}
  VLADE_OBJECT_STORAGE__S3__ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  VLADE_OBJECT_STORAGE__S3__REGION: ${S3_REGION:-us-east-1}
  VLADE_OBJECT_STORAGE__S3__ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  VLADE_OBJECT_STORAGE__S3__SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  VLADE_OBJECT_STORAGE__S3__PATH_STYLE: ${S3_PATH_STYLE:-true}
  VLADE_OBJECT_STORAGE__S3__CREATE_BUCKET: ${S3_CREATE_BUCKET:-false}
  # Server default for new knowledge bases (JSON). See .env.example.
  VLADE_DEFAULT_KB_CONFIG: ${VLADE_DEFAULT_KB_CONFIG:-{}}
  # Traces (ADR-0015, ADR-0026). With --profile phoenix: VLADE_OTEL__ENABLED=true,
  # VLADE_OTEL__ENDPOINT=http://phoenix:6006 and VLADE_OTEL__METRICS=false (Phoenix takes no metrics).
  # In staging and prod the default endpoint is the Alloy collector of the observability stack.
  VLADE_OTEL__ENABLED: ${VLADE_OTEL__ENABLED:-false}
  VLADE_OTEL__ENDPOINT: ${VLADE_OTEL__ENDPOINT:-http://alloy:4318}
  VLADE_OTEL__METRICS: ${VLADE_OTEL__METRICS:-true}
  VLADE_OTEL__PROJECT: ${VLADE_OTEL__PROJECT:-vlade-rag}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  # true: questions, answers and chunk texts go into the query log and the traces (personal data).
  VLADE_LIMITS__STORE_QUERY_TEXT: ${VLADE_LIMITS__STORE_QUERY_TEXT:-false}

services:
  migrate:
    profiles: [dev, staging, prod]
    image: vlade-rag:dev
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["vlade-rag", "db", "upgrade"]
    healthcheck:
      disable: true
    environment:
      <<: *app-env
      VLADE_DATABASE__OWNER_URL: postgresql://vlade_owner:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@postgres:5432/vlade
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: [dev, staging, prod]
    image: vlade-rag:dev
    environment:
      <<: *app-env
      # dev: the API also runs the ingestion worker. staging/prod: use the worker service.
      VLADE_API__EMBEDDED_WORKER: ${VLADE_EMBEDDED_WORKER:-true}
    volumes:
      - objects:/data/objects
      - graphdata:/data/graph
    ports:
      - "127.0.0.1:${VLADE_API_HOST_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      rustfs:
        condition: service_healthy
        required: false  # only with the s3, staging or prod profile
    mem_limit: 768m
    restart: unless-stopped

  worker:
    profiles: [staging, prod]
    image: vlade-rag:dev
    command: ["vlade-rag", "worker"]
    healthcheck:
      disable: true
    environment:
      <<: *app-env
    volumes:
      - objects:/data/objects
      - graphdata:/data/graph
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
        required: false
    mem_limit: 1g
    restart: unless-stopped

  mcp:
    # MCP server over Streamable HTTP at /mcp. Every request needs "Authorization: Bearer <key>".
    # In dev, run it on demand over stdio: vlade-rag mcp serve --transport stdio (MCP_SPEC 11.1).
    profiles: [staging, prod]
    image: vlade-rag:dev
    command: ["vlade-rag", "mcp", "serve", "--transport", "http", "--host", "0.0.0.0", "--port", "8765"]
    healthcheck:
      disable: true
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:${VLADE_MCP_HOST_PORT:-8765}:8765"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  postgres:
    profiles: [dev, staging, prod]
    # BM25 retriever (pg_search, AGPL-3.0, ADR-0022): set POSTGRES_DOCKERFILE=Dockerfile.bm25 and
    # POSTGRES_IMAGE=vlade-postgres-bm25:17 in .env. An existing volume keeps its data.
    build:
      context: ../postgres
      dockerfile: ${POSTGRES_DOCKERFILE:-Dockerfile}
    image: ${POSTGRES_IMAGE:-vlade-postgres:17}
    environment:
      POSTGRES_DB: vlade
      POSTGRES_USER: vlade_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      # Creates the knowledge graph database on a new volume (initdb/02-graph.sh).
      VLADE_GRAPH_DB_PASSWORD: ${VLADE_GRAPH_DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vlade_owner -d vlade"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    restart: unless-stopped

  valkey:
    profiles: [dev, staging, prod]
    image: valkey/valkey:9.2-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${VALKEY_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 320m
    restart: unless-stopped

  rustfs:
    # S3-compatible object storage, Apache-2.0 (ADR-0017). Locally: docker compose --profile dev --profile s3 up.
    # The services use it only with VLADE_OBJECT_STORAGE__BACKEND=s3 and S3_ENDPOINT_URL=http://rustfs:9000.
    # The entrypoint refuses to start with an empty S3_ACCESS_KEY_ID or S3_SECRET_ACCESS_KEY.
    profiles: [s3, staging, prod]
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-}
      RUSTFS_CONSOLE_ENABLE: ${RUSTFS_CONSOLE_ENABLE:-false}
      # RustFS sends traces, metrics and logs by OTLP. Empty: no telemetry.
      RUSTFS_OBS_ENDPOINT: ${RUSTFS_OBS_ENDPOINT:-}
    volumes:
      - s3data:/data
    ports:
      - "127.0.0.1:${S3_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped

  qdrant:
    # Alternative vector index (ADR-0004). Local: docker compose --profile dev --profile qdrant up.
    # The application uses it only with VLADE_VECTOR_INDEX__BACKEND=qdrant.
    profiles: [qdrant]
    image: qdrant/qdrant:v1.20.2
    volumes:
      - qdrantdata:/qdrant/storage
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped

  phoenix:
    # Arize Phoenix: AI traces and evaluation experiments (ADR-0026). Elastic License 2.0: a
    # separate service, not part of the Python package. Locally: --profile dev --profile phoenix.
    # UI and OTLP traces on port 6006. Authentication is off: the port listens on 127.0.0.1 only.
    # To turn it on, set PHOENIX_ENABLE_AUTH=true and PHOENIX_SECRET in a compose override file:
    # Phoenix refuses an empty secret, so this file does not pass one.
    profiles: [phoenix]
    image: arizephoenix/phoenix:version-22.0.0
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_ENABLE_AUTH: "false"
    volumes:
      - phoenix:/mnt/data
    ports:
      - "127.0.0.1:${PHOENIX_HOST_PORT:-6006}:6006"
    healthcheck:
      # The image has no shell and no curl: its Python checks the health endpoint.
      test: ["CMD", "/usr/bin/python3.13", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 1g
    restart: unless-stopped

  # ---------------------------------------------------------------- observability
  # Alloy receives OTLP from the API, the worker and the MCP server. It converts metrics to
  # Prometheus remote write, forwards traces to Tempo and reads Docker logs into Loki.
  # Staging uses the same collector with external backends through the three URLs below.
  alloy:
    profiles: [staging, prod]
    image: grafana/alloy:v1.22.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      PROMETHEUS_REMOTE_WRITE_URL: ${PROMETHEUS_REMOTE_WRITE_URL:-http://prometheus:9090/api/v1/write}
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:-http://loki:3100/loki/api/v1/push}
      TEMPO_OTLP_ENDPOINT: ${TEMPO_OTLP_ENDPOINT:-tempo:4317}
    volumes:
      - ../observability/alloy:/etc/alloy:ro
      - alloydata:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports:
      - "127.0.0.1:${ALLOY_OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "127.0.0.1:${ALLOY_OTLP_HTTP_HOST_PORT:-4318}:4318"
      - "127.0.0.1:${ALLOY_UI_HOST_PORT:-12345}:12345"
    mem_limit: 256m
    restart: unless-stopped

  prometheus:
    profiles: [prod]
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    volumes:
      - ../observability/prometheus:/etc/prometheus:ro
      - prometheusdata:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    mem_limit: 512m
    restart: unless-stopped

  loki:
    profiles: [prod]
    image: grafana/loki:3.7.10
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ../observability/loki:/etc/loki:ro
      - lokidata:/loki
    ports:
      - "127.0.0.1:${LOKI_HOST_PORT:-3100}:3100"
    mem_limit: 384m
    restart: unless-stopped

  tempo:
    profiles: [prod]
    image: grafana/tempo:2.10.10
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ../observability/tempo:/etc/tempo:ro
      - tempodata:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_HOST_PORT:-3200}:3200"
    mem_limit: 384m
    restart: unless-stopped

  grafana:
    profiles: [prod]
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    mem_limit: 384m
    restart: unless-stopped

  node-exporter:
    profiles: [prod]
    image: prom/node-exporter:v1.13.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    ports:
      - "127.0.0.1:${NODE_EXPORTER_HOST_PORT:-9100}:9100"
    pid: host
    mem_limit: 96m
    restart: unless-stopped

  cadvisor:
    profiles: [prod]
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    command:
      - --housekeeping_interval=15s
      - --docker_only=true
      - --store_container_labels=false
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:${CADVISOR_HOST_PORT:-8080}:8080"
    mem_limit: 192m
    restart: unless-stopped

  postgres-exporter:
    profiles: [prod]
    image: prometheuscommunity/postgres-exporter:v0.21.1
    environment:
      # The owner reads the statistics. The deployment guide shows a read-only role.
      DATA_SOURCE_NAME: postgresql://vlade_owner:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@postgres:5432/vlade?sslmode=disable
    ports:
      - "127.0.0.1:${POSTGRES_EXPORTER_HOST_PORT:-9187}:9187"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 96m
    restart: unless-stopped

  redis-exporter:
    profiles: [prod]
    image: oliver006/redis_exporter:v1.98.0
    environment:
      REDIS_ADDR: redis://valkey:6379
    ports:
      - "127.0.0.1:${REDIS_EXPORTER_HOST_PORT:-9121}:9121"
    depends_on:
      valkey:
        condition: service_healthy
    mem_limit: 96m
    restart: unless-stopped

  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.40.16
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    restart: unless-stopped

volumes:
  pgdata:
  graphdata:
  objects:
  s3data:
  qdrantdata:
  phoenix:
  ollama:
  alloydata:
  prometheusdata:
  lokidata:
  tempodata:
  grafanadata:
