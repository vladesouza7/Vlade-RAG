# Vlade-RAG services. Profiles: dev, staging, prod (docs/ARCHITECTURE.md section 17).
# Run from the repository root: docker compose --profile dev up
# Models: remote providers (OpenRouter, OpenCode, OpenAI) need only API keys in .env.
# Optional local model server: add --profile ollama and set OLLAMA_BASE_URL=http://ollama:11434
# Memory limits keep the dev profile under 3 GB without Ollama (RNF-11).

x-app-env: &app-env
  VLADE_ENVIRONMENT: ${VLADE_ENVIRONMENT:-dev}
  VLADE_LOG_LEVEL: ${VLADE_LOG_LEVEL:-INFO}
  VLADE_DATABASE__URL: postgresql://vlade_app:${VLADE_APP_DB_PASSWORD:?Defina VLADE_APP_DB_PASSWORD no arquivo .env}@postgres:5432/vlade
  VLADE_SECURITY__API_KEY_PEPPER: ${VLADE_API_KEY_PEPPER:?Defina VLADE_API_KEY_PEPPER no arquivo .env}
  # Cache and request limits in Valkey (ADR-0007). Set it empty to keep them in the process.
  VLADE_CACHE__URL: ${VLADE_CACHE__URL-redis://valkey:6379/0}
  VLADE_PROVIDERS__OLLAMA__BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  VLADE_PROVIDERS__OLLAMA__THINK: ${OLLAMA_THINK:-false}
  VLADE_PROVIDERS__OPENAI__API_KEY: ${OPENAI_API_KEY:-}
  VLADE_PROVIDERS__OPENROUTER__API_KEY: ${OPENROUTER_API_KEY:-}
  VLADE_PROVIDERS__OPENCODE__API_KEY: ${OPENCODE_API_KEY:-}
  VLADE_PROVIDERS__GEMINI__API_KEY: ${GEMINI_API_KEY:-}
  VLADE_PROVIDERS__GEMINI__EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-false}
  # Object storage: "filesystem" (a volume) or "s3" (AWS or any S3-compatible service, ADR-0006).
  VLADE_OBJECT_STORAGE__BACKEND: ${VLADE_OBJECT_STORAGE__BACKEND:-filesystem}
  VLADE_OBJECT_STORAGE__S3__BUCKET: ${S3_BUCKET:-}
  VLADE_OBJECT_STORAGE__S3__ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  VLADE_OBJECT_STORAGE__S3__REGION: ${S3_REGION:-us-east-1}
  VLADE_OBJECT_STORAGE__S3__ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  VLADE_OBJECT_STORAGE__S3__SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  VLADE_OBJECT_STORAGE__S3__PATH_STYLE: ${S3_PATH_STYLE:-true}
  VLADE_OBJECT_STORAGE__S3__CREATE_BUCKET: ${S3_CREATE_BUCKET:-false}
  # Server default for new knowledge bases (JSON). See .env.example.
  VLADE_DEFAULT_KB_CONFIG: ${VLADE_DEFAULT_KB_CONFIG:-{}}
  # Traces (ADR-0015, ADR-0026). With --profile phoenix: VLADE_OTEL__ENABLED=true,
  # VLADE_OTEL__ENDPOINT=http://phoenix:6006 and VLADE_OTEL__METRICS=false (Phoenix takes no metrics).
  VLADE_OTEL__ENABLED: ${VLADE_OTEL__ENABLED:-false}
  VLADE_OTEL__ENDPOINT: ${VLADE_OTEL__ENDPOINT:-}
  VLADE_OTEL__METRICS: ${VLADE_OTEL__METRICS:-true}
  VLADE_OTEL__PROJECT: ${VLADE_OTEL__PROJECT:-vlade-rag}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  # true: questions, answers and chunk texts go into the query log and the traces (personal data).
  VLADE_LIMITS__STORE_QUERY_TEXT: ${VLADE_LIMITS__STORE_QUERY_TEXT:-false}

services:
  migrate:
    profiles: [dev, staging, prod]
    image: vlade-rag:dev
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["vlade-rag", "db", "upgrade"]
    healthcheck:
      disable: true
    environment:
      <<: *app-env
      VLADE_DATABASE__OWNER_URL: postgresql://vlade_owner:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@postgres:5432/vlade
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: [dev, staging, prod]
    image: vlade-rag:dev
    environment:
      <<: *app-env
      # dev: the API also runs the ingestion worker. staging/prod: use the worker service.
      VLADE_API__EMBEDDED_WORKER: ${VLADE_EMBEDDED_WORKER:-true}
    volumes:
      - objects:/data/objects
    ports:
      - "127.0.0.1:${VLADE_API_HOST_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      rustfs:
        condition: service_healthy
        required: false  # only with the s3, staging or prod profile
    mem_limit: 768m
    restart: unless-stopped

  worker:
    profiles: [staging, prod]
    image: vlade-rag:dev
    command: ["vlade-rag", "worker"]
    healthcheck:
      disable: true
    environment:
      <<: *app-env
    volumes:
      - objects:/data/objects
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
        required: false
    mem_limit: 1g
    restart: unless-stopped

  mcp:
    # MCP server over Streamable HTTP at /mcp. Every request needs "Authorization: Bearer <key>".
    # In dev, run it on demand over stdio: vlade-rag mcp serve --transport stdio (MCP_SPEC 11.1).
    profiles: [staging, prod]
    image: vlade-rag:dev
    command: ["vlade-rag", "mcp", "serve", "--transport", "http", "--host", "0.0.0.0", "--port", "8765"]
    healthcheck:
      disable: true
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:${VLADE_MCP_HOST_PORT:-8765}:8765"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  postgres:
    profiles: [dev, staging, prod]
    # BM25 retriever (pg_search, AGPL-3.0, ADR-0022): set POSTGRES_DOCKERFILE=Dockerfile.bm25 and
    # POSTGRES_IMAGE=vlade-postgres-bm25:17 in .env. An existing volume keeps its data.
    build:
      context: ../postgres
      dockerfile: ${POSTGRES_DOCKERFILE:-Dockerfile}
    image: ${POSTGRES_IMAGE:-vlade-postgres:17}
    environment:
      POSTGRES_DB: vlade
      POSTGRES_USER: vlade_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vlade_owner -d vlade"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    restart: unless-stopped

  valkey:
    profiles: [dev, staging, prod]
    image: valkey/valkey:9.2-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${VALKEY_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 320m
    restart: unless-stopped

  rustfs:
    # S3-compatible object storage, Apache-2.0 (ADR-0017). Locally: docker compose --profile dev --profile s3 up.
    # The services use it only with VLADE_OBJECT_STORAGE__BACKEND=s3 and S3_ENDPOINT_URL=http://rustfs:9000.
    # The entrypoint refuses to start with an empty S3_ACCESS_KEY_ID or S3_SECRET_ACCESS_KEY.
    profiles: [s3, staging, prod]
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-}
      RUSTFS_CONSOLE_ENABLE: ${RUSTFS_CONSOLE_ENABLE:-false}
    volumes:
      - s3data:/data
    ports:
      - "127.0.0.1:${S3_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped

  phoenix:
    # Arize Phoenix: AI traces and evaluation experiments (ADR-0026). Elastic License 2.0: a
    # separate service, not part of the Python package. Locally: --profile dev --profile phoenix.
    # UI and OTLP traces on port 6006. Authentication is off: the port listens on 127.0.0.1 only.
    # To turn it on, set PHOENIX_ENABLE_AUTH=true and PHOENIX_SECRET in a compose override file:
    # Phoenix refuses an empty secret, so this file does not pass one.
    profiles: [phoenix]
    image: arizephoenix/phoenix:version-22.0.0
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_ENABLE_AUTH: "false"
    volumes:
      - phoenix:/mnt/data
    ports:
      - "127.0.0.1:${PHOENIX_HOST_PORT:-6006}:6006"
    healthcheck:
      # The image has no shell and no curl: its Python checks the health endpoint.
      test: ["CMD", "/usr/bin/python3.13", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 1g
    restart: unless-stopped

  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.40.16
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    restart: unless-stopped

volumes:
  pgdata:
  objects:
  s3data:
  phoenix:
  ollama:
