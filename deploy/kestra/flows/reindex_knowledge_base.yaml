id: reindex_knowledge_base
namespace: vlade
description: >
  Reindexa uma base com confirmação e acompanha o job até o fim. Manual (ADR-0027).
  O flow chama só a API REST.

inputs:
  - name: knowledge_base
    type: STRING
    required: true
  - name: mode
    type: STRING
    defaults: embeddings
    allowedValues: [embeddings, full]
  - name: embedding_model
    type: STRING
    required: false
  - name: poll_seconds
    type: INT
    defaults: 5
  - name: timeout_seconds
    type: INT
    defaults: 3600

tasks:
  - id: reindex
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    env:
      VLADE_API_URL: "{{ vars.vlade_api_url }}"
      VLADE_API_KEY: "{{ secrets.VLADE_API_KEY }}"
      KNOWLEDGE_BASE: "{{ inputs.knowledge_base }}"
      MODE: "{{ inputs.mode }}"
      EMBEDDING_MODEL: "{{ inputs.embedding_model }}"
      POLL_SECONDS: "{{ inputs.poll_seconds }}"
      TIMEOUT_SECONDS: "{{ inputs.timeout_seconds }}"
    script: |
      import json
      import os
      import time
      import urllib.error
      import urllib.request

      base = os.environ["VLADE_API_URL"].rstrip("/")
      key = os.environ["VLADE_API_KEY"]
      url = base + "/v1/knowledge-bases/" + os.environ["KNOWLEDGE_BASE"] + "/reindex"
      mode = os.environ["MODE"]
      body = {"mode": mode}
      model = os.environ.get("EMBEDDING_MODEL")
      if model and mode == "embeddings":
          body["embeddings"] = {"model": model}


      def request(target, payload=None):
          data = None if payload is None else json.dumps(payload).encode()
          headers = {"Authorization": "Bearer " + key, "Content-Type": "application/json"}
          req = urllib.request.Request(target, data=data, method="POST" if data else "GET", headers=headers)
          with urllib.request.urlopen(req, timeout=60) as response:
              return json.loads(response.read())


      preview = request(url, body)
      print("preview:", preview["chunks"], "chunks")
      job = request(url, {**body, "confirm": True})["job"]
      deadline = time.monotonic() + int(os.environ["TIMEOUT_SECONDS"])
      while True:
          status = request(base + "/v1/jobs/" + job["id"])
          if status["status"] in ("succeeded", "failed", "cancelled"):
              print("job", job["id"], status["status"])
              if status["status"] != "succeeded":
                  raise SystemExit(1)
              break
          if time.monotonic() > deadline:
              raise SystemExit("timeout waiting for job " + job["id"])
          time.sleep(int(os.environ["POLL_SECONDS"]))
