# Prometheus of the Vlade-RAG observability stack (ADR-0015).
# Alloy sends the OTLP metrics through the remote write receiver of this server.
# The exporters and Alloy itself are scraped here.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: vlade-rag

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: valkey
    static_configs:
      - targets: ["redis-exporter:9121"]
