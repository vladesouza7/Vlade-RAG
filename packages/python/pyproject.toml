[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "vlade-rag"
version = "0.0.1"
description = "Modular, extensible Retrieval-Augmented Generation (RAG) framework."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vlade-RAG contributors" }]
keywords = ["rag", "retrieval-augmented-generation", "llm", "mcp", "pgvector"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Core install: domain, ports, use cases, configuration. Permissive licenses only (ADR-0001).
dependencies = [
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
]

# Extras are added phase by phase. Full target list: docs/ARCHITECTURE.md section 2.
[project.optional-dependencies]
native = ["vlade-rag-core==0.0.1"]
api = [
    "fastapi>=0.165.0",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]
cli = ["typer>=0.19.0"]
postgres = [
    "asyncpg>=0.32.0",
    "pgvector>=0.5.1",
]
docling = ["docling>=2.151.1"]
otel = [
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
]
ollama = ["httpx2>=2.16.2"]
openai = ["httpx2>=2.16.2"]
cache = ["redis>=8.1.0"]  # Valkey or Redis (ADR-0007)
mcp = [
    "mcp>=2.3.0",  # official MCP SDK (ADR-0013)
    "jsonschema>=4.20.0",  # validation of tool arguments against the input schema
]
s3 = ["boto3>=1.44.7"]  # S3 API: AWS and compatible services (ADR-0006)
langgraph = ["langgraph>=1.2.24"]  # optional query graph engine (ADR-0011, ADR-0023)
eval = ["ragas>=0.4.4"]  # answer metrics with RAGAS (RF-71, ADR-0025); calls an LLM
# Local reranker (ADR-0008, ADR-0018). Pulls PyTorch and, on Linux, NVIDIA CUDA libraries with a
# proprietary license, so it stays out of "server" and out of the license check (ADR-0001, item 4).
local-models = ["sentence-transformers>=3.4.0"]
server = ["vlade-rag[native,api,cli,postgres,ollama,openai,otel,cache,mcp,s3]"]

[project.scripts]
vlade-rag = "vlade_rag.cli:main"

[project.urls]
Homepage = "https://github.com/vladesouza7/Vlade-RAG"
Repository = "https://github.com/vladesouza7/Vlade-RAG"
Issues = "https://github.com/vladesouza7/Vlade-RAG/issues"

[tool.uv.sources]
vlade-rag-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["vlade_rag"]

[tool.hatch.build.targets.sdist]
include = ["vlade_rag", "README.md", "LICENSE"]
